<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title></title>
    <link href="main.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    </meta>
</head>

<body>
    <div class="container">
        <header>
            <img class="image-header" src="テスト画像.png" />
            <p class="info-header">高専人生ゲームは人生ゲームのような「人生」ではなく<br>5年間の「高専人生」にフォーカスしたボードゲームです</p>
        </header>

        <div class="flex flex-sp">
            <section class="how-to-play">
                <h2>How to Play</h2>
                <p>1．下のリンクから台紙と遊び方をダウンロード<br>2．印刷してプレイ</p>
            </section>

            <section class="download">
                <h2>How to Make</h2>
                <a href="#" onclick="downloadFiles()">ダウンロードはこちら</a>
                
                <script>
                    function downloadFiles() {
                        const files = [
                            '01_money.pdf',
                            '02_class.pdf',
                            '03_map.pdf',
                            '04_torisetu.pdf'
                        ];

                        files.forEach(file => {
                            const link = document.createElement('a');
                            link.href = file;
                            link.download = file.split('/').pop();
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        });
                    }
                </script>

            </section>
        </div>
        <div class="recycle flex">
            <div class="before"><img class="image-header" src="テスト画像.png" /></div>
            <div class="arrow"><img class="image-header" src="fig-arrow.svg" /></div>
            <div class="after"><img class="image-header" src="テスト画像.png" /></div>
        </div>
        <section class="environment">
            <h2>環境</h2>
            <p>ここに環境に関する説明が入ります。</p>
        </section>
    </div>
</body>

</html>
